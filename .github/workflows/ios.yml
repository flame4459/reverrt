name: iOS build and tests

# Note: the app's deployment target is iOS 26, so this needs a runner whose
# Xcode ships the iOS 26 SDK (Xcode 26+). On a plain macos-latest image that is
# not guaranteed — point `runs-on` at an image or self-hosted runner that has
# it, or keep this workflow manual-only until it does.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: revert.xcodeproj
  APP_SCHEME: Revert

jobs:
  build-and-test:
    # Change this to your runner label if you keep Xcode on a self-hosted box.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(key):
              try:
                  return tuple(int(p) for p in key.split("."))
              except ValueError:
                  return (0,)
          for runtime in sorted(devices, key=version, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["name"])
                      raise SystemExit
          raise SystemExit("no iPhone simulator found")
          ')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme RevertTests \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme RevertTests \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO

      - name: Release build (simulator)
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-release \
            CODE_SIGNING_ALLOWED=NO

      - name: Give the simulator a location
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.name }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.name }}" -b || true
          xcrun simctl location booted set 37.7749,-122.4194 || true

      - name: UI audit (non-blocking)
        continue-on-error: true
        run: |
          rm -rf Audit.xcresult
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme RevertUITests \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath .build \
            -resultBundlePath Audit.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:RevertUITests/RevertAuditUITests

      - name: Upload audit screenshots and result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revert-audit
          path: |
            Audit.xcresult
            .screens
          if-no-files-found: ignore
          retention-days: 14
